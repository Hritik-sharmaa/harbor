name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the in-box .NET Framework compiler
        shell: cmd
        run: build.cmd

      - name: Package
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { "Harbor-$env:GITHUB_REF_NAME" } else { 'Harbor' }
          New-Item -ItemType Directory dist/Harbor | Out-Null
          Copy-Item bin/Harbor.exe, bin/Harbor.exe.config, 'tools/Install Harbor.cmd', LICENSE dist/Harbor/
          Compress-Archive dist/Harbor/* "dist/$name.zip"
          "ZIP=dist/$name.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: Harbor
          path: dist/Harbor/

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          body_path: CHANGELOG.md
